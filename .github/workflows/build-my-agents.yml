name: Build DBX Agents

on:
  workflow_dispatch:
  push:
    branches:
      - my-agents

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 (DBX + ODBC + Firebird agents)
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify environment
        shell: pwsh
        run: |
          Write-Output "node: $(node --version)"
          Write-Output "pnpm: $(pnpm --version)"
          Write-Output "cargo: $(cargo --version)"
          Write-Output "rustc: $(rustc --version)"
          Write-Output "dotnet: $(dotnet --version)"
          Write-Output "perl: $((perl --version | Select-Object -First 2) -join ' ')"

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      # 为什么必须有这一步：`pnpm tauri build` 的 beforeBuildCommand 是 `pnpm build`（纯 vite build，
      # esbuild 直接剥类型），**不做类型检查**。于是「按 DatabaseType 穷举的映射表漏了某个 db_type」
      # 这类错误（如 DATABASE_NAMESPACE_CREATION_MATRIX 缺 odbc/odbc32）在编译期毫无征兆，
      # 只在运行时 `Entry[db_type].field` 抛 TypeError —— 症状是右键连接菜单直接不弹。
      # vue-tsc 会把 satisfies Record<DatabaseType, ...> 的缺键报成 TS2740。
      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Build ODBC agent (64-bit)
        working-directory: agents/drivers/odbc
        shell: pwsh
        run: |
          # net48 framework-dependent：去掉 --self-contained / -p:PublishSingleFile（Framework 不支持单文件）
          dotnet publish -c Release -r win-x64 -o publish
          Get-ChildItem publish/dbx-agent-odbc.* | Rename-Item -NewName { $_.Name -replace 'dbx-agent-odbc','agent' }

      - name: Build ODBC agent (32-bit)
        working-directory: agents/drivers/odbc
        shell: pwsh
        run: |
          dotnet publish -c Release -r win-x86 -o publish-x86
          Get-ChildItem publish-x86/dbx-agent-odbc.* | Rename-Item -NewName { $_.Name -replace 'dbx-agent-odbc','agent' }

      # Firebird Embedded agent. x86 ONLY - all three bundled engines (fb25/fb30/fb50) are
      # Win32/x86 and native DLL bitness is absolute, so there is no x64/x86 pair here.
      # build.ps1 carries the engines/ copy behind a Test-Path guard because engines/ is
      # ~89 MB and deliberately not in git: CI produces agent.exe alone and the engines are
      # copied in at packaging time.
      # The PE assertion is not decorative - flipping PlatformTarget to AnyCPU/x64 builds
      # and runs fine, then fails at the first P/Invoke into an x86 fbclient.
      - name: Build Firebird Embedded agent (32-bit)
        working-directory: agents/drivers/firebird-embedded
        shell: pwsh
        run: |
          # -ExecutionPolicy Bypass is explicit: the runner's pwsh shell does not go through
          # `-ExecutionPolicy Bypass`, so a Restricted/RemoteSigned machine policy would kill
          # this step at the very first line with an unhelpful error.
          pwsh -NoProfile -ExecutionPolicy Bypass -File build.ps1

          $exe = Get-Item publish/agent.exe
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $lfanew = [System.BitConverter]::ToUInt32($bytes, 0x3C)          # e_lfanew
          $machine = [System.BitConverter]::ToUInt16($bytes, $lfanew + 4)  # IMAGE_FILE_HEADER.Machine
          if ($machine -ne 0x014C) {
            throw ("agent.exe is not x86 (PE machine 0x{0:X4}, expected 0x014C)" -f $machine)
          }
          Write-Output ("agent.exe: {0:N0} bytes, PE machine 0x{1:X4} (x86) OK" -f $exe.Length, $machine)

      - name: Build Tauri (dbx.exe)
        run: pnpm tauri build --no-bundle

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbx-agents-windows-x64
          retention-days: 14
          path: |
            target/release/dbx.exe
            agents/drivers/odbc/publish
            agents/drivers/odbc/publish-x86
            agents/drivers/firebird-embedded/publish

  build-win7:
    name: Build Windows 7-compatible dbx.exe (win7-target)
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      # win7 必须静态链接 CRT，否则目标机缺 msvcp*.dll 起不来
      RUSTFLAGS: -C debuginfo=line-tables-only -C target-feature=+crt-static

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 抄上游 ci.yml/windows-win7-bundle：必须用固定日期 nightly（浮动 nightly 可能已移除
      # win7 target），只装 rust-src，由 -Z build-std 从源码现编 win7 的 std
      # （nightly 不为 x86_64-win7-windows-msvc 这个 Tier-2 target 发预编译 std）。
      - name: Setup Rust (nightly-2026-07-22 + rust-src, build-std from source)
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-22
          components: rust-src

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare Win7-compatible WebView2 loader
        shell: pwsh
        run: ./.github/scripts/prepare-webview2-win7-loader.ps1

      - name: Prepare WebView2 109 fixed runtime
        shell: pwsh
        run: ./.github/scripts/prepare-webview2-win7-runtime.ps1

      - name: Build frontend
        run: pnpm build

      # 关键：用 cargo build 直编，绕过 Tauri CLI 对未安装 target 的预校验
      # （Tauri CLI 会先 rustup target list 校验，win7 target 未安装即报 does not exist；
      #  直接 cargo build + -Z build-std 会从 rust-src 现编 std，无需 target 预装）。
      # 第 3 次尝试 run 35360190275 正是死在 Tauri CLI 的该预校验上。
      - name: Build DBX for Windows 7 (cargo build, bypass Tauri target precheck)
        shell: pwsh
        run: |
          $env:TAURI_CONFIG = Get-Content src-tauri/tauri.webview2-win7-fixed.conf.json -Raw
          cargo build --package dbx --release --features custom-protocol --target x86_64-win7-windows-msvc -Z build-std=std,panic_abort

      - name: Upload win7 dbx.exe
        uses: actions/upload-artifact@v4
        with:
          name: dbx-win7-x64
          retention-days: 14
          path: target/x86_64-win7-windows-msvc/release/dbx.exe
